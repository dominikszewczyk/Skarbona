services:
  app:
    image: ghcr.io/dominikszewczyk/skarbona:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_HOST: ${DB_HOST:?DB_HOST is required}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      DB_SCHEMA: ${DB_SCHEMA:-skarbona}
      API_PORT: 3000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - database
    ports:
      - "8080:80"

networks:
  database:
    external: true
    name: ${DB_NETWORK:-database_network}
