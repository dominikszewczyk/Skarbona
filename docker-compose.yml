services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skarbona}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skarbona}
      POSTGRES_DB: ${POSTGRES_DB:-skarbona}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    image: ${APP_IMAGE:-ghcr.io/${GHCR_NAMESPACE:-local}/skarbona:${IMAGE_TAG:-latest}}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/}
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-skarbona}:${POSTGRES_PASSWORD:-skarbona}@db:5432/${POSTGRES_DB:-skarbona}?schema=skarbon}
      API_PORT: 3000
    depends_on:
      - db
    ports:
      - "8080:80"

volumes:
  postgres_data:
