services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-skarbona}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-skarbona}
      POSTGRES_DB: ${DB_NAME:-skarbona}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    image: ${APP_IMAGE:-ghcr.io/${GHCR_NAMESPACE:-local}/skarbona:${IMAGE_TAG:-latest}}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/}
    environment:
      DATABASE_URL: postgresql://${DB_USER:-skarbona}:${DB_PASSWORD:-skarbona}@${DB_HOST:-db}:5432/${DB_NAME:-skarbona}?schema=${DB_SCHEMA:-skarbona}
      API_PORT: 3000
    depends_on:
      - db
    ports:
      - "8080:80"

volumes:
  postgres_data:
